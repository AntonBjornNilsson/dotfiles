hotKeys:

  # Hitting Shift-0 navigates to your namespace view
  namespace:
    shortCut: Shift-0
    description: View namespace
    command: ns

  # Hitting Shift-1 navigates to your pod view
  pods:
    shortCut: Shift-1
    description: View Pods
    command: pods

  # Hitting Shift-2 navigates to your service view
  service:
    shortCut: Shift-2
    description: View Service
    command: service

  # Hitting Shift-3 navigates to your pvc view
  pvc:
    shortCut: Shift-3
    description: View PVC
    command: pvc


  # Hitting Shift-8 navigates to your helmrelease view
  helmrelease:
    shortCut: Shift-8
    description: View helmrelease
    command: helmrelease

  # Hitting Shift-9 navigates to your ks view
  ks:
    shortCut: Shift-9
    description: View Kustomizations
    command: ks
